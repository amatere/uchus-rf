<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Учусь.РФ</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js"></script>
</head>
<body>
    <div class="app-container">
        <nav class="top-nav">
            <div class="nav-brand"><a href="index.html">Учусь.РФ</a></div>
            <div class="nav-links">
                <a href="login.html" class="nav-link">Войти</a>
                <a href="register.html" class="nav-link btn-register">Регистрация</a>
            </div>
        </nav>
        <main class="main-content">
            <div class="auth-page">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1>Вход в систему</h1>
                        <p>Войдите в свой аккаунт</p>
                    </div>
                    <form class="auth-form" id="loginForm" onsubmit="return handleLogin(event)">
                        <div class="form-group">
                            <label for="login">Логин</label>
                            <input type="text" id="login" name="login" required placeholder="Введите логин">
                            <span class="form-error" id="loginError"></span>
                        </div>
                        <div class="form-group">
                            <label for="password">Пароль</label>
                            <input type="password" id="password" name="password" required placeholder="Введите пароль">
                            <span class="form-error" id="passwordError"></span>
                        </div>
                        <div id="formAlert" class="form-alert form-alert-error" style="display:none;"></div>
                        <button type="submit" class="btn btn-primary btn-full">Войти</button>
                    </form>
                    <div class="auth-footer">
                        <a href="register.html">Ещё не зарегистрированы? Регистрация</a>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <p>&copy; 2026 Учусь.РФ — платформа онлайн-обучения</p>
        </footer>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;
            const alert = document.getElementById('formAlert');
            
            if (!login || !password) {
                alert.textContent = 'Заполните все поля';
                alert.style.display = 'block';
                return;
            }
            
            const users = DB.getUsers();
            const user = users.find(u => u.login === login);
            
            if (!user) {
                alert.textContent = 'Пользователь с таким логином не найден';
                alert.style.display = 'block';
                return;
            }
            
            if (user.password !== password) {
                alert.textContent = 'Неверный пароль';
                alert.style.display = 'block';
                return;
            }
            
            DB.setCurrentUser({ id: user.id, login: user.login, fullname: user.fullname, phone: user.phone, email: user.email, role: user.role });
            window.location.href = user.role === 'admin' ? 'admin.html' : 'profile.html';
        }
    </script>
</body>
</html>
